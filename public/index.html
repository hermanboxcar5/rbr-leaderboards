<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RBR Leaderboard</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8edff;background:#0a0d19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0%,#24315a 0%,#0a0d19 42%);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:54px 20px}.eyebrow{color:#9faeff;font-weight:700;letter-spacing:.2em;font-size:12px}h1{font-size:clamp(38px,6vw,66px);letter-spacing:-.055em;margin:12px 0}p{color:#aab3d0}.panel{margin-top:34px;background:#141a2ccc;border:1px solid #303b58;border-radius:22px;overflow:hidden;box-shadow:0 18px 65px #0005}.toolbar{display:flex;gap:12px;padding:22px;border-bottom:1px solid #303b58;flex-wrap:wrap}input,button,select{font:inherit;border-radius:11px;padding:13px 16px}select{background:#0d1324;border:1px solid #394464;color:white;cursor:pointer}input{flex:1;min-width:190px;background:#0d1324;border:1px solid #394464;color:white;outline:none}input:focus{border-color:#8298ff}button{cursor:pointer;border:1px solid #455378;background:#273456;color:white}button:hover:not(:disabled){background:#3b4e82}button:disabled{opacity:.35;cursor:not-allowed}.status{font-size:13px;color:#aeb9d6;padding:0 24px}.head,.player{display:grid;grid-template-columns:90px 1fr 140px;gap:15px;align-items:center;padding:17px 24px}.head{color:#8794b7;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.player{border-top:1px solid #27324c}.player:hover{background:#202a43}.rank{font-weight:800;color:#a9b8f6}.name{font-weight:650;overflow-wrap:anywhere}.score{text-align:right;font-variant-numeric:tabular-nums;color:#dce5ff}.footer{padding:22px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #303b58}.footer div{display:flex;gap:8px}.muted{color:#9ba9c8;font-size:13px}@media(max-width:550px){.wrap{padding:35px 12px}.head,.player{grid-template-columns:55px 1fr 90px;padding:15px 13px;gap:8px}.toolbar{padding:14px}.footer{padding:14px}}
</style></head><body><main class="wrap"><div class="eyebrow">ROCKET BOT ROYALE · RANKINGS</div><h1>Global leaderboard<span style="color:#869bff">.</span></h1><p>Explore the competition, search players on the current page, and browse rankings.</p><section class="panel"><div class="toolbar"><select id="board" aria-label="Leaderboard"><option value="trophies">🏆 Trophies</option><option value="points">⭐ Points</option></select><input id="search" placeholder="Search display names on this page…" aria-label="Search display names"><button id="refresh">Refresh</button></div><p id="status" class="status">Loading rankings…</p><div class="head"><span>Rank</span><span>Player</span><span style="text-align:right">Score</span></div><div id="rows"></div><div class="footer"><span id="page" class="muted">Page 1</span><div><button id="prev">Previous</button><button id="next">Next</button></div></div></section></main><script>
let page=1,all=[],hasNext=false;const pageSize=50;const $=id=>document.getElementById(id);
function render(){const q=$('search').value.trim().toLocaleLowerCase();const rows=all.filter(r=>r.name.toLocaleLowerCase().includes(q));$('rows').replaceChildren();for(const r of rows){const div=document.createElement('div');div.className='player';for(const [cls,value] of [['rank','#'+r.rank],['name',r.name],['score',Number(r.score).toLocaleString()]]){const s=document.createElement('span');s.className=cls;s.textContent=value;div.append(s)}$('rows').append(div)}if(!rows.length){const d=document.createElement('p');d.className='status';d.textContent='No players found on this page.';$('rows').append(d)}$('page').textContent='Page '+page+' · ranks '+((page-1)*pageSize+1)+'–'+(page*pageSize);$('prev').disabled=page<=1;$('next').disabled=!hasNext}
async function load(){ $('status').textContent='Loading page '+page+'…';$('prev').disabled=$('next').disabled=true;try{const from=(page-1)*pageSize+1;const to=from+pageSize-1;const res=await fetch('/api/leaderboard?board='+encodeURIComponent($('board').value)+'&from='+from+'&to='+to);const data=await res.json();if(!res.ok)throw Error(data.error||'Unable to load');all=data.records||[];hasNext=!!data.nextCursor||all.length===50;$('status').textContent=all.length+' players loaded · search filters this page only';render()}catch(e){all=[];hasNext=false;$('status').textContent='Error: '+e.message;render()}}
$('board').addEventListener('change',()=>{page=1;load()});$('search').addEventListener('input',render);$('refresh').onclick=load;$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(hasNext){page++;load()}};load();
</script></body></html>
