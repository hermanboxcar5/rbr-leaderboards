
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBR Leaderboard</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8edff;background:#0a0d19}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 70% 0%,#24315a 0%,#0a0d19 42%);min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:54px 20px}
.eyebrow{color:#9faeff;font-weight:700;letter-spacing:.2em;font-size:12px}
h1{font-size:clamp(38px,6vw,66px);letter-spacing:-.055em;margin:12px 0}
p{color:#aab3d0}
.panel{margin-top:34px;background:#141a2ccc;border:1px solid #303b58;border-radius:22px;overflow:hidden;box-shadow:0 18px 65px #0005}
.toolbar{display:flex;gap:12px;padding:22px;border-bottom:1px solid #303b58;flex-wrap:wrap}
input,button,select{font:inherit;border-radius:11px;padding:13px 16px}
select{background:#0d1324;border:1px solid #394464;color:white;cursor:pointer}
input{flex:1;min-width:190px;background:#0d1324;border:1px solid #394464;color:white;outline:none}
input:focus{border-color:#8298ff}
button{cursor:pointer;border:1px solid #455378;background:#273456;color:white}
button:hover:not(:disabled){background:#3b4e82}
button:disabled{opacity:.35;cursor:not-allowed}
.status{font-size:13px;color:#aeb9d6;padding:0 24px}
.head,.player{display:grid;grid-template-columns:90px 1fr 140px;gap:15px;align-items:center;padding:17px 24px}
.head{color:#8794b7;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.player{border-top:1px solid #27324c}
.player:hover{background:#202a43}
.rank{font-weight:800;color:#a9b8f6}
.name{font-weight:650;overflow-wrap:anywhere}
.score{text-align:right;font-variant-numeric:tabular-nums;color:#dce5ff}
.footer{padding:22px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #303b58}
.pagination{display:flex;gap:8px;align-items:center}
.pagination button{min-width:46px}
.page-input{width:72px;min-width:0;flex:none;text-align:center;padding:13px 8px;font-variant-numeric:tabular-nums}
.page-input::-webkit-inner-spin-button,.page-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.page-input{-moz-appearance:textfield;appearance:textfield}
.muted{color:#9ba9c8;font-size:13px}
@media(max-width:550px){
.wrap{padding:35px 12px}
.head,.player{grid-template-columns:55px 1fr 90px;padding:15px 13px;gap:8px}
.toolbar{padding:14px}
.footer{padding:14px}
}
</style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">ROCKET BOT ROYALE · RANKINGS</div>
<h1>Global leaderboard<span style="color:#869bff">.</span></h1>
<p>Explore the competition, search the top 10,000 players, and browse rankings.</p>
<section class="panel">
<div class="toolbar">
<select id="board" aria-label="Leaderboard">
<option value="trophies">🏆 Trophies</option>
<option value="points">⭐ Points</option>
</select>
<input id="search" placeholder="Search top 10,000 display names…" aria-label="Search display names">
<button id="refresh">Refresh</button>
</div>
<p id="status" class="status">Loading rankings…</p>
<div class="head">
<span>Rank</span>
<span>Player</span>
<span style="text-align:right">Score</span>
</div>
<div id="rows"></div>
<div class="footer">
<span id="page" class="muted">Page 1</span>
<div class="pagination">
<button id="prev" aria-label="Previous page">&lt;</button>
<input id="pageInput" class="page-input" type="number" min="1" step="1" value="1" aria-label="Page number">
<button id="next" aria-label="Next page">&gt;</button>
</div>
</div>
</section>
</main>
<script>
let page=1, hasNext=false, controller=null, timer=null;
const $=id=>document.getElementById(id);

function render(records,total){
  $('rows').replaceChildren();
  for(const r of records){
    const div=document.createElement('div');
    div.className='player';
    for(const [cls,value] of [
      ['rank','#'+r.rank],
      ['name',r.name],
      ['score',Number(r.score).toLocaleString()]
    ]){
      const span=document.createElement('span');
      span.className=cls;
      span.textContent=value;
      div.append(span);
    }
    $('rows').append(div);
  }
  if(!records.length){
    const p=document.createElement('p');
    p.className='status';
    p.textContent='No players found.';
    $('rows').append(p);
  }
  $('page').textContent='Page '+page+
    (total===null
      ?' · ranks '+((page-1)*100+1)+'–'+(page*100)
      :' · '+total.toLocaleString()+' matches');
  $('pageInput').value=page;
  $('prev').disabled=page<=1;
  $('next').disabled=!hasNext;
}

async function load(){
  if(controller)controller.abort();
  controller=new AbortController();
  const signal=controller.signal;
  $('pageInput').value=page;
  $('status').textContent='Loading '+
    ($('search').value.trim()?'search results':'page '+page)+'…';
  $('prev').disabled=$('next').disabled=true;
  try{
    const params=new URLSearchParams({
      board:$('board').value,
      page:String(page),
      search:$('search').value.trim()
    });
    const response=await fetch('/api/leaderboard?'+params,{signal});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Unable to load leaderboard');
    hasNext=data.hasNext;
    $('status').textContent=data.searchScope
      ?'Searching top 10,000 players · 100 results per page'
      :'100 players per page';
    render(data.records,data.total);
  }catch(error){
    if(error.name==='AbortError')return;
    hasNext=false;
    $('status').textContent='Error: '+error.message;
    render([],null);
  }
}

function goToPage(){
  const input=$('pageInput');
  const value=Number(input.value);
  if(!Number.isSafeInteger(value)||value<1){
    input.value=page;
    return;
  }
  if(value!==page){
    page=value;
    load();
  }
}

$('board').addEventListener('change',()=>{
  page=1;
  load();
});
$('search').addEventListener('input',()=>{
  page=1;
  clearTimeout(timer);
  timer=setTimeout(load,350);
});
$('refresh').onclick=load;
$('prev').onclick=()=>{
  if(page>1){
    page--;
    load();
  }
};
$('next').onclick=()=>{
  if(hasNext){
    page++;
    load();
  }
};
$('pageInput').addEventListener('keydown',event=>{
  if(event.key==='Enter'){
    event.preventDefault();
    goToPage();
    event.target.blur();
  }
});
load();
</script>
</body>
</html>
